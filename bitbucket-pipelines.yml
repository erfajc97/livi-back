image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Deploy main to EC2
          deployment: staging
          script:
            - pipe: atlassian/ssh-run:0.8.1
              variables:
                SSH_USER: 'ubuntu'
                SERVER: '13.59.237.74'
                MODE: 'command'
                EXTRA_ARGS: '-o ServerAliveInterval=1200 -o ServerAliveCountMax=3'
                COMMAND: |
                  set -e

                  # Fuerza el path clásico de Docker Compose: sin bake ni
                  # attestation manifests. Con bake activo, las imágenes van a
                  # un image-store (containerd) distinto al que lee `up`, y el
                  # contenedor de postgres falla con "No such image".
                  export COMPOSE_BAKE=false
                  export BUILDX_NO_DEFAULT_ATTESTATIONS=1

                  cd ~/api-ecommerce-nestjs

                  echo "Updating code..."
                  git fetch origin main
                  git reset --hard origin/main

                  echo "Stopping current containers..."
                  docker compose down --remove-orphans

                  echo "Pulling postgres base image (classic engine, retry on Docker Hub limits)..."
                  for i in 1 2 3 4 5; do
                    docker pull postgres:16-alpine && break
                    echo "postgres pull attempt $i failed, retrying in 20s..."
                    sleep 20
                  done

                  echo "Building and starting containers (entrypoint will run seeders)..."
                  docker compose up -d --build

                  echo "Cleaning unused Docker resources (after up, so live images stay cached)..."
                  docker image prune -af
                  docker builder prune -af || true

                  echo "Current container status:"
                  docker compose ps
