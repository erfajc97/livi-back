image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Deploy main to EC2
          deployment: staging
          script:
            - pipe: atlassian/ssh-run:0.8.1
              variables:
                SSH_USER: 'ubuntu'
                SERVER: '13.59.237.74'
                MODE: 'command'
                EXTRA_ARGS: '-o ServerAliveInterval=1200 -o ServerAliveCountMax=3'
                COMMAND: |
                  set -e

                  # OJO: este script viaja dentro de bash -c con comillas
                  # simples, asi que NO puede contener comillas simples ni
                  # backticks: rompen la cadena y el shell muere con
                  # "unexpected EOF". Usar solo comillas dobles.
                  #
                  # COMPOSE_BAKE/attestations off: build y run comparten un
                  # solo image store.
                  export COMPOSE_BAKE=false
                  export BUILDX_NO_DEFAULT_ATTESTATIONS=1

                  cd ~/api-ecommerce-nestjs

                  echo "Updating code..."
                  git fetch origin main
                  git reset --hard origin/main

                  echo "=== Disk / Docker usage ==="
                  df -h / || true
                  docker system df || true

                  # La imagen solo se descarga si falta. Al no bajar nunca la
                  # DB (ver abajo), en deploys siguientes ya esta presente y no
                  # se toca Docker Hub.
                  echo "Ensuring postgres image is present..."
                  if docker image inspect postgres:16-alpine > /dev/null 2>&1; then
                    echo "postgres:16-alpine ya presente."
                  else
                    echo "postgres:16-alpine ausente, descargando..."
                    if ! docker pull postgres:16-alpine; then
                      echo "FALLO REAL: docker pull postgres:16-alpine"
                      echo "  toomanyrequests -> limite Docker Hub, corre docker login en el server"
                      echo "  no space left   -> disco lleno, corre docker image prune -af (NUNCA --volumes)"
                      echo "  timeout/dns/io  -> el server no alcanza registry-1.docker.io"
                      exit 1
                    fi
                  fi

                  # No se hace compose down: tirar la DB borraba su contenedor
                  # y obligaba a re-descargar postgres en cada deploy. La DB
                  # queda arriba y solo se reconstruye la api.
                  echo "Ensuring db is up..."
                  docker compose up -d db

                  echo "Rebuilding and restarting only the api (entrypoint runs seeders)..."
                  docker compose up -d --build --no-deps api

                  echo "Checking api stayed up..."
                  sleep 25
                  # No usar {{ }} ni comillas simples: el pipe ssh-run las rompe
                  # y el check fallaba con el API ya arriba (logs de Nest OK).
                  if ! docker compose ps --status running --services | grep -w api; then
                    echo "API no quedo running despues del deploy"
                    docker compose logs --tail=120 api
                    exit 1
                  fi

                  echo "Pruning dangling layers and old build cache (keeps tagged images)..."
                  docker image prune -f || true
                  docker builder prune -f --filter until=168h || true

                  echo "Current container status:"
                  docker compose ps
